# @package _global_

defaults:
  - override /model: nnp
  - override /model/representation: painn
  - override /data: rgd1

run:
  experiment: rgd1_atomwise_${globals.state}

globals:
  cutoff: 6.
  lr: 1e-4
  property: energy
  aggregation: sum
  state: [reactants, ts, products]

data:
  states: ${globals.state}
  transforms:
    - _target_: schnetpack.transform.SubtractCenterOfMass
    - _target_: schnetpack.transform.RemoveOffsets
      property: ${globals.property}
      remove_atomrefs: True
      remove_mean: False
    - _target_: schnetpack.transform.RemoveGroupOffsets
      property: ${globals.property}
      is_extensive: True
    - _target_: schnetpack.transform.MatScipyNeighborList
      cutoff: ${globals.cutoff}
    - _target_: schnetpack.transform.CastTo32

model:
  output_modules:
    - _target_: schnetpack.atomistic.Atomwise
      output_key: ${globals.property}
      n_in: ${model.representation.n_atom_basis}
      aggregation_mode: ${globals.aggregation}
  postprocessors:
    - _target_: schnetpack.transform.CastTo64
    - _target_: schnetpack.transform.AddGroupOffsets
      property: ${globals.property}
      is_extensive: True
    - _target_: schnetpack.transform.AddOffsets
      property: ${globals.property}
      add_mean: False
      add_atomrefs: True

task:
  outputs:
    - _target_: schnetpack.task.GroupedEnergyOutput
      name: ${globals.property}
      target_property: ${globals.property}
      loss_fn:
        _target_: torch.nn.MSELoss
      metrics:
        mae:
          _target_: torchmetrics.regression.MeanAbsoluteError
        rmse:
          _target_: torchmetrics.regression.MeanSquaredError
          squared: False
        # delta_e_mae:
        #   _target_: schnetpack.train.metrics.DeltaEMAE
        # delta_e_rmse:
        #   _target_: schnetpack.train.metrics.DeltaERMSE
      loss_weight: 1.
