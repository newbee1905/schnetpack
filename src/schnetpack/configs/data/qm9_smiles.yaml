defaults:
  - custom

_target_: schnetpack.datasets.QM9

# datapath: ${run.data_dir}/qm9_tblite.lmdb # data_dir is specified in train.yaml
datapath: ${run.data_dir}/qm9_smiles.lmdb
batch_size: 64
num_train: 110000
num_val: 10000
remove_uncharacterized: True
num_workers: 2
optimize_geometries: False
use_smiles: True
distance_threshold: 0.5


# convert to typically used units
distance_unit: Ang
property_units:
  energy_U0: eV
  energy_U: eV
  enthalpy_H: eV
  free_energy: eV
  homo: eV
  lumo: eV
  gap: eV
  zpve: eV
